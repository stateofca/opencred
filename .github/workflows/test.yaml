name: Test

on: [push]

jobs:
  test:
    if: ${{ vars.WORKFLOW_TEST_ENABLED == 'true' }}
    # The `ubuntu-24.04` image's kernel trips MongoDB 8's startup kernel
    # check (actions/runner-images#15005). Return to `ubuntu-latest` once a
    # `mongo:8` image with the fix (8.0.35 or 8.3.14) is released.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Run test with Node.js ${{ matrix.node-version }}
        run: npm run test
