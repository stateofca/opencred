name: Test

on: [push]

jobs:
  test:
    if: ${{ vars.WORKFLOW_TEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 26.x is temporarily removed. Node 26's bundled undici rejects the
        # dispatcher handler shape used by undici@6, which arrives via
        # @digitalbazaar/http-client, so every test that makes an HTTP request
        # fails with `InvalidArgumentError: invalid onError method`. Restore
        # once http-client depends on undici@7.
        node-version: [22.x, 24.x]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Run test with Node.js ${{ matrix.node-version }}
        run: npm run test
