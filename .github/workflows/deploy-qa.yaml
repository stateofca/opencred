name: Deploy to QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Resolve the enable flag in a normal job so an undefined variable defaults
  # to 'false' and the run skips cleanly. A reusable-workflow call gated
  # directly on `if: vars.X == 'true'` fails the whole run at load time when X
  # is undefined, instead of skipping. See header for details.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Resolve enable flag
        id: gate
        run: echo "enabled=${{ vars.WORKFLOW_DEPLOY_QA_ENABLED == 'true' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.enabled == 'true' }}
    uses: digitalbazaar/cadmv-qa-environment-tf/.github/workflows/deploy-app-reusable.yml@main
    with:
      # CUSTOMIZE THESE FOR YOUR APP:
      app_name: opencred # Must match Terraform module name
      image_repository: us-docker.pkg.dev/cadmv-qa-environment/app-images/opencred-platform
      gcp_project_id: cadmv-qa-environment

      auto_apply: true

      # OPTIONAL: Custom Dockerfile location
      # dockerfile_path: ./docker/Dockerfile
      # build_context: .

    secrets:
      # Get these from the environment's TF state outputs
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      # This is a CADMV Dev team TF token
      TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
